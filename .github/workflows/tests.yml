name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep iPhone | head -10

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project StockFlow.xcodeproj \
            -scheme StockFlow \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:StockFlowTests \
            CODE_SIGNING_ALLOWED=NO
